<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    
</head>
<body>
    <div>
        <h3>Todo App-Edit</h3>
    </div>
    <form action="{% url 'updateData' d.id %}" method="POST">
                {% csrf_token %}
                <span style="display: flex;">
                    <input type="text" class="form-control" placeholder="Add a Task" name="task" value="{{d.task}}">
                    <button type="submit" class="btn btn-primary" style="width:200px"><i class="bi bi-plus-square"></i> Edit</button>
                </span>
    </form>
</body>
